description: "Speech-to-text for Hermes via Dshx (Qwx) — voice messages and live dictation. Needs a Qwx AI Platform API key. Disclosure — voice messages and live dictation audio are uploaded to Albx's Qwx AI Platform (Dshx, maas.qianwenaiapi.com by default, or the base URL set in stt.dshx.base_url / TRANSCRIPTION_DSHX_BASE_URL / DSHX_BASE_URL); the API key is TRANSCRIPTION_DSHX_API_KEY, falling back to the HERMES_CUSTOM_DSHX_API_KEY custom-provider key or the built-in Albx provider's DSHX_API_KEY; clips are converted with the local ffmpeg into a temporary wav that is deleted afterwards."
